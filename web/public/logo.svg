<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 271.2 62.7" width="271.2" height="62.7" fill="none" role="img" aria-labelledby="ombuds-logo-title">
  <title id="ombuds-logo-title">Ombuds</title>
  <!--
    Full Ombuds lockup. The mark plus the word, both drawn as geometry, no <text> and no webfont.
    The word is a hand drawn condensed grotesk: cap height 48, x height 12.5 down from the cap
    line, stem 7.4 (ratio 0.154, which is the SemiBold the tokens ask for), monoline so it sits
    with the monoline mark. The mark is set at three times its 24 unit grid, which puts its ring
    stroke at 6.3 against the word's 7.4 stem, and its ink on a 62.7 circle against the word's
    48 cap. Gap between them is 22 units, a little under half a cap height.

    This file is the one to use where the logo is an <img>: a README, an email signature, a slide.
    It carries its own colour and flips with the reader's system theme. Inside the app use
    <Logo /> from components/brand instead, which is driven by currentColor and sets the real
    Archivo variable font. For a single flat colour, for masking or for print on an appeal
    letter, use mark.svg, which inherits whatever colour it is given.
  -->
  <style>
    .ombuds-mark { stroke: #8a1ee6; }
    .ombuds-word { stroke: #1b191f; }
    @media (prefers-color-scheme: dark) {
      .ombuds-mark { stroke: #c285ff; }
      .ombuds-word { stroke: #f4f2f7; }
    }
  </style>
  <g transform="translate(0 7.35)" stroke-linecap="butt" stroke-linejoin="round">
    <g class="ombuds-mark" transform="translate(-4.65 -12) scale(3)">
      <path d="M3.654 16.325A9.4 9.4 0 1 0 2.662 13.075" stroke-width="2.1"/>
      <path d="M1.905 14.7H14.3a2.7 2.7 0 0 0 0-5.4H5.8" stroke-width="1.85"/>
    </g>
    <g class="ombuds-word" transform="translate(84.7 0)" stroke-width="7.4">
      <g transform="translate(0 0)"><path d="M18 3C28.01 3 32.3 8.88 32.3 24C32.3 39.12 28.01 45 18 45C7.99 45 3.7 39.12 3.7 24C3.7 8.88 7.99 3 18 3Z"/></g>
      <g transform="translate(38.6 0)"><path d="M3.7 48V12.5"/><path d="M3.7 20.5C3.7 17.2 6.2 16.1 11.1 16.1C16 16.1 18.5 17.2 18.5 20.5V48"/><path d="M18.5 20.5C18.5 17.2 21 16.1 25.9 16.1C30.8 16.1 33.3 17.2 33.3 20.5V48"/></g>
      <g transform="translate(79 0)"><path d="M3.7 -2V48"/><path d="M3.7 15.7H12.2C18.3 15.7 22.8 19.5 22.8 25.1V35.4C22.8 41 18.3 44.8 12.2 44.8H3.7"/></g>
      <g transform="translate(108.3 0)"><path d="M3.7 12.5V36.3C3.7 41.5 7.6 44.8 12.5 44.8C17.4 44.8 21.3 41.5 21.3 36.3V12.5"/></g>
      <g transform="translate(136.1 0)"><path d="M22.8 -2V48"/><path d="M22.8 15.7H14.3C8.2 15.7 3.7 19.5 3.7 25.1V35.4C3.7 41 8.2 44.8 14.3 44.8H22.8"/></g>
      <g transform="translate(165.4 0)"><path d="M17 20.5C17 17.6 14.6 15.9 10.5 15.9C6.4 15.9 3.7 17.8 3.7 21.3C3.7 24.6 6.3 26.2 11 27.6C15.1 28.8 17.4 30.8 17.4 34.4C17.4 38.3 14.6 44.6 10.2 44.6C6.3 44.6 3.9 42.8 3.9 39.8"/></g>
    </g>
  </g>
</svg>
